<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ИИ-репетитор ОГЭ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;padding:12px;color:#e2e8f0}
.wrapper{max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:rgba(30,41,59,.8);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.15);border-radius:20px;padding:14px 20px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:700;color:#f1f5f9}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.logo span{background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.subjects{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.subject-btn{flex:1 1 auto;background:rgba(51,65,85,.6);border:1px solid rgba(148,163,184,.2);color:#cbd5e1;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:.78rem;font-weight:500;transition:all .2s;white-space:nowrap}
.subject-btn.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;color:#fff}
.task-selector{background:rgba(30,41,59,.75);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.15);border-radius:20px;padding:18px;margin-bottom:16px}
.task-selector-title{font-size:.85rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;font-weight:600}
.task-numbers{display:flex;flex-wrap:wrap;gap:8px}
.task-num-btn{background:rgba(51,65,85,.6);border:1px solid rgba(148,163,184,.2);color:#cbd5e1;width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:.95rem;font-weight:700;transition:all .15s;display:flex;align-items:center;justify-content:center;position:relative}
.task-num-btn:hover:not(.disabled){background:rgba(99,102,241,.25);border-color:#6366f1;transform:translateY(-2px)}
.task-num-btn.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;color:#fff}
.task-num-btn.disabled{opacity:.3;cursor:not-allowed}
.task-num-btn .count{position:absolute;top:-4px;right:-4px;background:#0ea5e9;color:#fff;font-size:.6rem;padding:2px 5px;border-radius:8px;font-weight:600;min-width:16px;text-align:center}
.main-grid{display:grid;grid-template-columns:1fr 380px;gap:20px}
.card{background:rgba(30,41,59,.75);backdrop-filter:blur(12px);border:1px solid rgba(148,163,184,.15);border-radius:20px;padding:20px}
.card-title{font-size:1.05rem;font-weight:700;color:#f1f5f9;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:rgba(99,102,241,.2);color:#a5b4fc;font-size:.68rem;padding:3px 10px;border-radius:20px;font-weight:600}
.task-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(148,163,184,.12)}
.task-num-info{font-size:.8rem;color:#94a3b8}
.task-num-info strong{color:#a5b4fc}
.progress-info{font-size:.8rem;color:#94a3b8}
.progress-bar-bg{width:100%;height:5px;background:rgba(51,65,85,.6);border-radius:10px;overflow:hidden;margin-bottom:18px}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:10px;transition:width .4s ease}
.question{font-size:1rem;line-height:1.55;color:#e2e8f0;margin-bottom:18px;font-weight:500;white-space:pre-line}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.option{background:rgba(51,65,85,.5);border:1px solid rgba(148,163,184,.15);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s;font-size:.95rem;color:#cbd5e1;display:flex;align-items:center;gap:12px}
.option:hover:not(.disabled){background:rgba(99,102,241,.15);border-color:#6366f1}
.option .letter{width:30px;height:30px;border-radius:9px;background:rgba(99,102,241,.2);color:#a5b4fc;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:.85rem}
.option.correct{background:rgba(34,197,94,.15);border-color:#22c55e;color:#bbf7d0}
.option.correct .letter{background:#22c55e;color:#fff}
.option.wrong{background:rgba(239,68,68,.15);border-color:#ef4444;color:#fecaca}
.option.wrong .letter{background:#ef4444;color:#fff}
.option.disabled{cursor:default;opacity:.85}
.task-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;padding:11px 16px;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;flex:1 1 auto;justify-content:center}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-secondary{background:rgba(51,65,85,.6);color:#cbd5e1;border:1px solid rgba(148,163,184,.2)}
.btn-ai{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chat-card{display:flex;flex-direction:column;height:calc(100vh - 320px);min-height:400px}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px;margin-bottom:12px}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:#475569;border-radius:10px}
.msg{display:flex;gap:8px;animation:msgIn .3s ease}
.msg.user{flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.msg.ai .msg-avatar{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.msg.user .msg-avatar{background:#475569}
.msg-bubble{max-width:85%;padding:10px 14px;border-radius:14px;font-size:.88rem;line-height:1.5;word-break:break-word}
.msg.ai .msg-bubble{background:rgba(51,65,85,.7);color:#e2e8f0;border-bottom-left-radius:4px;border:1px solid rgba(148,163,184,.1)}
.msg.user .msg-bubble{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-bottom-right-radius:4px}
.msg-bubble strong{color:#a5b4fc}
.msg.user .msg-bubble strong{color:#e0e7ff}
.chat-input-row{display:flex;gap:8px;background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.15);border-radius:14px;padding:4px 4px 4px 14px}
.chat-input-row input{flex:1;background:transparent;border:none;outline:none;color:#e2e8f0;font-size:.92rem;padding:10px 0}
.chat-input-row input::placeholder{color:#64748b}
.chat-input-row button{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quick-questions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.quick-q{background:rgba(51,65,85,.5);border:1px solid rgba(148,163,184,.15);color:#94a3b8;padding:6px 12px;border-radius:20px;font-size:.75rem;cursor:pointer}
.quick-q.highlight{background:rgba(14,165,233,.2);color:#7dd3fc;border-color:#0ea5e9}
.result-box{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:14px;padding:14px;margin-top:16px;display:none}
.result-box.show{display:block}
.result-box h3{font-size:.95rem;color:#86efac;margin-bottom:8px}
.result-box p{font-size:.85rem;color:#cbd5e1;line-height:1.55}
.stats-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.stat-item{background:rgba(15,23,42,.5);border-radius:10px;padding:8px 12px;min-width:80px;flex:1 1 80px}
.stat-label{font-size:.65rem;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.stat-value{font-size:1.15rem;font-weight:700;color:#a5b4fc}
.stat-value.green{color:#86efac}
.stat-value.red{color:#fca5a5}
.empty-state{text-align:center;padding:40px 20px;color:#64748b}
.empty-state .emoji{font-size:2.5rem;margin-bottom:12px}
@media(max-width:900px){.main-grid{grid-template-columns:1fr}.chat-card{height:500px}.task-num-btn{width:40px;height:40px;font-size:.85rem}}
@media(max-width:500px){.task-num-btn{width:36px;height:36px;font-size:.8rem}.subject-btn{font-size:.68rem;padding:7px 5px}}
</style>
</head>
<body>
<div class="wrapper">
<header>
<div class="logo"><div class="logo-icon">🎓</div><div>ИИ-репетитор <span>ОГЭ</span></div></div>
<div class="subjects" id="subjects">
<button class="subject-btn active" data-subject="math">📐 Матем.</button>
<button class="subject-btn" data-subject="rus">📖 Русский</button>
<button class="subject-btn" data-subject="inf">💻 Информ.</button>
<button class="subject-btn" data-subject="soc">🌍 Общество</button>
<button class="subject-btn" data-subject="phys">⚛️ Физика</button>
</div>
</header>

<div class="task-selector">
<div class="task-selector-title">🎯 Выбери номер задания (по 8 вопросов без повторов)</div>
<div class="task-numbers" id="taskNumbers"></div>
</div>

<div class="main-grid">
<div class="card">
<div class="card-title">📝 Тренажёр <span class="badge" id="currentTaskLabel">Выбери номер</span></div>
<div id="taskArea"><div class="empty-state"><div class="emoji">👆</div><div>Выбери номер задания выше, чтобы начать</div></div></div>
<div class="result-box" id="resultBox">
<h3 id="resultTitle">🎉 Задание выполнено!</h3>
<p id="resultText"></p>
<div class="stats-row">
<div class="stat-item"><div class="stat-label">Верно</div><div class="stat-value green" id="statCorrect">0</div></div>
<div class="stat-item"><div class="stat-label">Ошибок</div><div class="stat-value red" id="statWrong">0</div></div>
<div class="stat-item"><div class="stat-label">Всего</div><div class="stat-value" id="statTotal">0</div></div>
</div>
</div>
</div>

<div class="card chat-card">
<div class="card-title">🤖 ИИ-помощник <span class="badge">онлайн</span></div>
<div class="chat-messages" id="chatMessages"></div>
<div class="quick-questions" id="quickQuestions">
<div class="quick-q highlight" data-q="объясни текущее задание">💡 Объясни</div>
<div class="quick-q" data-q="почему мой ответ неправильный">❌ Почему неверно?</div>
<div class="quick-q" data-q="как решать это задание">🧮 Как решать?</div>
</div>
<div class="chat-input-row">
<input type="text" id="chatInput" placeholder="Спроси ИИ...">
<button id="chatSend">➤</button>
</div>
</div>
</div>
</div>

<script>
// ============================================================
// БАЗА ЗАДАНИЙ ПО НОМЕРАМ — по 8 вопросов на каждый номер
// ============================================================
const TASKS_BY_NUMBER = {
// ================ МАТЕМАТИКА (№1-25) ================
math: {
1:[
{q:"Для квартиры 65 кв.м натяжной потолок по 850 руб/кв.м. Сколько заплатит?",options:["55250","54500","56000","54000"],correct:0,explanation:"65 × 850 = 55250.",topic:"Практика"},
{q:"Для квартиры 48 кв.м потолок по 720 руб/кв.м. Сколько заплатит?",options:["34560","34000","35000","33000"],correct:0,explanation:"48 × 720 = 34560.",topic:"Практика"},
{q:"Котёл 1 кВт на 10 кв.м. Дом 150 кв.м. Мощность котла?",options:["15 кВт","10 кВт","20 кВт","12 кВт"],correct:0,explanation:"150 / 10 = 15 кВт.",topic:"Практика"},
{q:"Печь-цилиндр: диаметр 40 см, высота 90 см. Площадь боковой поверхности (π=3.14), кв.м?",options:["1.13","1.5","1.0","1.2"],correct:0,explanation:"S=πd·h=3.14×0.4×0.9≈1.13.",topic:"Практика"},
{q:"Плитка 20×20 см. Комната 3×4 м. Сколько плиток?",options:["300","250","200","350"],correct:0,explanation:"S=12 кв.м. Плитка=0.04. 12/0.04=300.",topic:"Практика"},
{q:"Упаковка ламината 2 кв.м. Комната 5×4 м. Упаковок?",options:["10","12","8","15"],correct:0,explanation:"20/2=10.",topic:"Практика"},
{q:"Электрический чайник 2 кВт работал 30 мин. Энергия, кВт·ч?",options:["1","0.5","2","1.5"],correct:0,explanation:"2×0.5=1 кВт·ч.",topic:"Практика"},
{q:"Тариф 5 руб/кВт·ч. Расход 250 кВт·ч. Оплата?",options:["1250","1000","1500","1200"],correct:0,explanation:"250×5=1250 руб.",topic:"Практика"}
],
2:[
{q:"Шина 185/65 R15. Диаметр колеса в мм (1 дюйм=25.4)?",options:["621.5","615.3","630","600"],correct:0,explanation:"15×25.4+2×185×0.65=621.5.",topic:"Шины"},
{q:"Шина 205/55 R16. Диаметр колеса в мм?",options:["631.9","620","640","650"],correct:0,explanation:"16×25.4+2×205×0.55=631.9.",topic:"Шины"},

{q:"Заменили 205/55 R16 на 205/60 R16. На сколько мм увеличится радиус?",options:["10.25","11","12","9"],correct:0,explanation:"Δ=205×0.05=10.25 мм.",topic:"Шины"},
{q:"Шина 215/65 R16. Диаметр в мм?",options:["685.9","680","690","670"],correct:0,explanation:"16×25.4+2×215×0.65=685.9.",topic:"Шины"},
{q:"Шина 175/70 R14. Диаметр в мм?",options:["600.6","595","610","620"],correct:0,explanation:"14×25.4+2×175×0.70=600.6.",topic:"Шины"},
{q:"Сколько мм в 1 дюйме?",options:["25.4","24","30","20"],correct:0,explanation:"25.4 мм.",topic:"Шины"},
{q:"Шина 225/45 R17. Диаметр в мм?",options:["634.3","630","640","620"],correct:0,explanation:"17×25.4+2×225×0.45=634.3.",topic:"Шины"}
],
3:[
{q:"План 1:100. 8×6 см. Реальная площадь (кв.м)?",options:["48","480","4.8","0.48"],correct:0,explanation:"8×6=48 кв.м.",topic:"План"},
{q:"План 1:200. 5×4 см. Площадь (кв.м)?",options:["80","800","8","8000"],correct:0,explanation:"10×8=80 кв.м.",topic:"План"},
{q:"План 1:50. 10×8 см. Площадь (кв.м)?",options:["20","200","2","2000"],correct:0,explanation:"5×4=20 кв.м.",topic:"План"},
{q:"Комната 6×5 м. Какая площадь (кв.м)?",options:["30","11","25","36"],correct:0,explanation:"6×5=30.",topic:"План"},
{q:"Кухня 3.5×4 м. Площадь?",options:["14","15","12","16"],correct:0,explanation:"14 кв.м.",topic:"План"},
{q:"План 1:100. 12×9 см. Площадь (кв.м)?",options:["108","1080","10.8","10800"],correct:0,explanation:"12×9=108 кв.м.",topic:"План"},
{q:"Комната 4×3.5 м. Периметр?",options:["15","14","16","17"],correct:0,explanation:"2(4+3.5)=15.",topic:"План"},

{q:"Печь 1 кВт на 10 кв.м. Дом 120 кв.м. Мощность?",options:["12 кВт","10 кВт","14 кВт","15 кВт"],correct:0,explanation:"12 кВт.",topic:"Отопление"},
{q:"Печь 1 кВт на 8 кв.м. Дом 96 кв.м. Мощность?",options:["12 кВт","10 кВт","8 кВт","14 кВт"],correct:0,explanation:"12 кВт.",topic:"Отопление"},

{q:"Плитка 30×30, комната 4.2×3.6. Упаковок (в упаковке 12)?",options:["14","15","13","16"],correct:0,explanation:"15.12/0.09=168, 168/12=14.",topic:"Плитка"},
{q:"Обои 10 м × 0.5 м. Стены 18×2.8=50.4 кв.м. Рулонов?",options:["11","10","12","9"],correct:0,explanation:"50.4/5=10.08 → 11.",topic:"Ремонт"},

{q:"2/3 + 1/6",options:["5/6","3/9","1/2","2/9"],correct:0,explanation:"5/6.",topic:"Дроби"},
{q:"3/4 − 1/2",options:["1/4","1/2","2/4","1/8"],correct:0,explanation:"1/4.",topic:"Дроби"},
{q:"3/5 × 10/9",options:["2/3","30/45","3/9","1/3"],correct:0,explanation:"2/3.",topic:"Дроби"},

let currentSubject='math';
let currentTaskNumber=null;
let answered=false;
let stats={correct:0,wrong:0,total:0};
let usedIndices={};
let currentTask=null;

// ============ УТИЛИТЫ ============
function shuffle(arr){
const a=[...arr];
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

// Получить задание БЕЗ ПОВТОРОВ (пока все не пройдены)
function getTaskByNumber(subject,number){
const tasks=TASKS_BY_NUMBER[subject]?.[number];
if(!tasks||tasks.length===0)return null;

if(!usedIndices[subject])usedIndices[subject]={};
if(!usedIndices[subject][number])usedIndices[subject][number]=new Set();

// Если все использованы — сбрасываем
if(usedIndices[subject][number].size>=tasks.length){
usedIndices[subject][number].clear();
}

// Ищем неиспользованный индекс
let available=[];
for(let i=0;i<tasks.length;i++){
if(!usedIndices[subject][number].has(i))available.push(i);
}

const idx=available[Math.floor(Math.random()*available.length)];
usedIndices[subject][number].add(idx);

const original=tasks[idx];
const correctText=original.options[original.correct];
const shuffledOptions=shuffle(original.options);
const newCorrectIndex=shuffledOptions.indexOf(correctText);

return{
q:original.q,
options:shuffledOptions,
correct:newCorrectIndex,
explanation:original.explanation,
topic:original.topic,
number:number
};
}

// ============ DOM ============
const taskArea=document.getElementById('taskArea');
const taskNumbersEl=document.getElementById('taskNumbers');
const resultBox=document.getElementById('resultBox');
const chatMessages=document.getElementById('chatMessages');
const chatInput=document.getElementById('chatInput');
const chatSend=document.getElementById('chatSend');
const subjectsEl=document.getElementById('subjects');
const currentTaskLabel=document.getElementById('currentTaskLabel');

// ============ РЕНДЕР НОМЕРОВ ============
function renderTaskNumbers(){
const numbers=Object.keys(TASKS_BY_NUMBER[currentSubject]).map(Number).sort((a,b)=>a-b);
taskNumbersEl.innerHTML=numbers.map(num=>{
const tasks=TASKS_BY_NUMBER[currentSubject][num];
const count=tasks?tasks.length:0;
const isActive=currentTaskNumber===num?'active':'';
return `<button class="task-num-btn ${isActive}" data-number="${num}" ${count===0?'disabled':''}>${num}${count>0?`<span class="count">${count}</span>`:''}</button>`;
}).join('');

taskNumbersEl.querySelectorAll('.task-num-btn:not(.disabled)').forEach(btn=>{
btn.addEventListener('click',()=>{
const num=parseInt(btn.dataset.number);
selectTaskNumber(num);
});
});
}

// ============ ВЫБОР НОМЕРА ============
function selectTaskNumber(number){
currentTaskNumber=number;
currentTaskLabel.textContent=`Задание №${number}`;
resultBox.classList.remove('show');
answered=false;
renderTaskNumbers();
renderTask();
}

// ============ РЕНДЕР ЗАДАНИЯ ============
function renderTask(){
if(currentTaskNumber===null)return;

currentTask=getTaskByNumber(currentSubject,currentTaskNumber);
answered=false;

if(!currentTask){
taskArea.innerHTML=`<div class="empty-state"><div class="emoji">📭</div><div>Для задания №${currentTaskNumber} пока нет вопросов</div></div>`;
return;
}

const totalForNumber=TASKS_BY_NUMBER[currentSubject][currentTaskNumber].length;
const usedCount=usedIndices[currentSubject]?.[currentTaskNumber]?.size||0;
const progress=Math.min((usedCount/totalForNumber)*100,100);

taskArea.innerHTML=`
<div class="task-header">
<div class="task-num-info">Номер <strong>${currentTaskNumber}</strong> · Пройдено <strong>${usedCount}</strong> из ${totalForNumber}</div>
<div class="progress-info">✅ ${stats.correct} · ❌ ${stats.wrong}</div>
</div>
<div class="progress-bar-bg">
<div class="progress-bar-fill" style="width:${progress}%"></div>
</div>
<div class="question">${currentTask.q}</div>
<div class="options" id="options">
${currentTask.options.map((opt,i)=>`
<div class="option" data-index="${i}">
<div class="letter">${String.fromCharCode(65+i)}</div>
<div>${opt}</div>
</div>
`).join('')}
</div>
<div class="task-actions">
<button class="btn btn-secondary" id="nextBtn" disabled>Другой вопрос →</button>
<button class="btn btn-ai" id="explainBtn">🤖 Объясни</button>
</div>
`;

document.querySelectorAll('.option').forEach(opt=>{
opt.addEventListener('click',()=>selectOption(opt));
});

document.getElementById('nextBtn').addEventListener('click',()=>{
resultBox.classList.remove('show');
renderTask();
});

document.getElementById('explainBtn').addEventListener('click',()=>{
chatInput.value="объясни текущее задание";
sendChat();
});
}

// ============ ВЫБОР ОТВЕТА ============
function selectOption(optEl){
if(answered)return;
answered=true;

const selectedIndex=parseInt(optEl.dataset.index);
const task=currentTask;
const isCorrect=selectedIndex===task.correct;

document.querySelectorAll('.option').forEach(o=>{
o.classList.add('disabled');
const idx=parseInt(o.dataset.index);
if(idx===task.correct)o.classList.add('correct');
else if(idx===selectedIndex&&!isCorrect)o.classList.add('wrong');
});

stats.total++;
if(isCorrect){
stats.correct++;
showResult(true,task.explanation);
addChatMessage('ai',`✅ <strong>Верно!</strong> ${task.explanation}`);
}else{
stats.wrong++;
const correctLetter=String.fromCharCode(65+task.correct);
showResult(false,`Правильный ответ: ${correctLetter}. ${task.explanation}`);
addChatMessage('ai',`❌ <strong>Не совсем.</strong> Правильный ответ — ${correctLetter}. ${task.explanation}`);
}

document.getElementById('nextBtn').disabled=false;
}

function showResult(isCorrect,text){
resultBox.classList.add('show');
document.getElementById('resultTitle').textContent=isCorrect?'🎉 Верно!':'😔 Ошибка';
document.getElementById('resultText').textContent=text;
document.getElementById('statCorrect').textContent=stats.correct;
document.getElementById('statWrong').textContent=stats.wrong;
document.getElementById('statTotal').textContent=stats.total;
}

// ============ СМЕНА ПРЕДМЕТА ============
subjectsEl.addEventListener('click',(e)=>{
const btn=e.target.closest('.subject-btn');
if(!btn)return;
document.querySelectorAll('.subject-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
currentSubject=btn.dataset.subject;
currentTaskNumber=null;
currentTaskLabel.textContent='Выбери номер';
taskArea.innerHTML=`<div class="empty-state"><div class="emoji">👆</div><div>Выбери номер задания выше, чтобы начать</div></div>`;
resultBox.classList.remove('show');
renderTaskNumbers();
});

// ============ ЧАТ ============
function addChatMessage(role,text){
const msg=document.createElement('div');
msg.className=`msg ${role}`;
msg.innerHTML=`<div class="msg-avatar">${role==='ai'?'🤖':'👤'}</div><div class="msg-bubble">${text}</div>`;
chatMessages.appendChild(msg);
chatMessages.scrollTop=chatMessages.scrollHeight;
}

function generateAIAnswer(query){
const q=query.toLowerCase().trim();

if(q.includes('привет')||q.includes('здравств')){
return 'Привет! 👋 Выбери предмет, потом номер задания, реши его, а если что-то непонятно — спроси меня!';
}

if(q.includes('объясни')||q.includes('разбери')||q.includes('не понял')||q.includes('решение')){
if(!currentTask)return 'Сначала выбери номер задания и реши его!';
const correctLetter=String.fromCharCode(65+currentTask.correct);
return `<strong>📖 Разбор задания №${currentTask.number}</strong><br><br>
<em>Вопрос:</em> ${currentTask.q}<br><br>
<em>Тема:</em> ${currentTask.topic||'не указана'}<br><br>
<em>Правильный ответ:</em> <strong>${correctLetter}) ${currentTask.options[currentTask.correct]}</strong><br><br>
<em>Решение:</em><br>${currentTask.explanation}`;
}

if(q.includes('почему')||q.includes('неверно')||q.includes('ошибка')){
if(!currentTask)return 'Сначала выбери задание!';
return `Возможные причины ошибки:<br>• Неверное понимание условия<br>• Ошибка в вычислениях<br>• Незнание формулы или правила<br><br>Разбери решение выше и попробуй похожее задание снова.`;
}

if(q.includes('физик')){
return `<strong>⚛️ Физика ОГЭ:</strong><br>• №1-10 — механика, тепло<br>• №11-13 — электричество, магнетизм<br>• №14-15 — оптика<br>• №16 — атомная физика`;
}
if(q.includes('русск')){
return `<strong>📖 Русский ОГЭ:</strong><br>• №2-8 — тестовая часть<br>• №1 — изложение<br>• №9 — сочинение`;
}
if(q.includes('обществ')){
return `<strong>🌍 Обществознание ОГЭ:</strong><br>• №1-20 — тест<br>• №21-24 — работа с текстом`;
}
if(q.includes('матем')){
return `<strong>📐 Математика ОГЭ:</strong><br>• №1-5 — практика<br>• №6-14 — алгебра<br>• №15-19 — геометрия<br>• №20-25 — развёрнутые`;
}
if(q.includes('информ')){
return `<strong>💻 Информатика ОГЭ:</strong><br>• №1-16 — тестовая часть`;
}

return `Не могу распознать вопрос. Попробуй:<br>• «объясни текущее задание»<br>• «почему мой ответ неправильный»<br>• «как решать это»`;
}

function sendChat(){
const text=chatInput.value.trim();
if(!text)return;
addChatMessage('user',text);
chatInput.value='';
setTimeout(()=>{
addChatMessage('ai',generateAIAnswer(text));
},400);
}

chatSend.addEventListener('click',sendChat);
chatInput.addEventListener('keypress',(e)=>{if(e.key==='Enter')sendChat();});

document.getElementById('quickQuestions').addEventListener('click',(e)=>{
const q=e.target.closest('.quick-q');
if(!q)return;
chatInput.value=q.dataset.q;
sendChat();
});

// ============ ИНИЦИАЛИЗАЦИЯ ============
renderTaskNumbers();
addChatMessage('ai','Привет! 👋 В сайте 5 предметов, в каждом номере по 8 вопросов без повторов!<br><br>📐 Математика (№1-25)<br>📖 Русский (№2-8)<br>💻 Информатика (№1-16)<br>🌍 Обществознание (№1-24)<br>⚛️ Физика (№1-16)<br><br>Выбери предмет и номер!');
</script>
