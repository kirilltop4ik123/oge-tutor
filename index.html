<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ-репетитор ОГЭ — подготовка к экзаменам</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 24px;
            padding: 18px 28px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: -0.02em;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 6px 20px -4px #6366f1a0;
        }

        .logo span {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subjects {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .subject-btn {
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
            padding: 9px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .subject-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            color: #e0e7ff;
        }

        .subject-btn.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-color: transparent;
            color: white;
            box-shadow: 0 6px 16px -4px #6366f1a0;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 24px;
        }

        @media (max-width: 950px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 24px;
            padding: 26px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title .badge {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        }

        .task-num {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .task-num strong {
            color: #a5b4fc;
        }

        .progress-info {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(51, 65, 85, 0.6);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .question {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 22px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .option {
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 14px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 1rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .option:hover:not(.disabled) {
            background: rgba(99, 102, 241, 0.15);
            border-color: #6366f1;
            transform: translateX(4px);
        }

        .option .letter {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
            font-size: 0.9rem;
        }

        .option.correct {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e;
            color: #bbf7d0;
        }

        .option.correct .letter {
            background: #22c55e;
            color: white;
        }

        .option.wrong {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #fecaca;
        }

        .option.wrong .letter {
            background: #ef4444;
            color: white;
        }

        .option.disabled {
            cursor: default;
            opacity: 0.85;
        }

        .task-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 13px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 6px 20px -6px #6366f1a0;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -6px #6366f1c0;
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.6);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(71, 85, 105, 0.8);
            color: #f1f5f9;
        }

        .chat-card {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
            min-height: 500px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-right: 6px;
            margin-bottom: 16px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(51, 65, 85, 0.4);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        .msg {
            display: flex;
            gap: 10px;
            animation: msgIn 0.3s ease;
        }

        .msg.user {
            flex-direction: row-reverse;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .msg.ai .msg-avatar {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
        }

        .msg.user .msg-avatar {
            background: #475569;
        }

        .msg-bubble {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.55;
            word-break: break-word;
        }

        .msg.ai .msg-bubble {
            background: rgba(51, 65, 85, 0.7);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .msg.user .msg-bubble {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-bubble strong {
            color: #a5b4fc;
        }

        .msg.user .msg-bubble strong {
            color: #e0e7ff;
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 16px;
            padding: 6px 6px 6px 16px;
        }

        .chat-input-row input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e2e8f0;
            font-size: 0.95rem;
            padding: 10px 0;
        }

        .chat-input-row input::placeholder {
            color: #64748b;
        }

        .chat-input-row button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            flex-shrink: 0;
        }

        .chat-input-row button:hover {
            transform: scale(1.05);
        }

        .quick-questions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .quick-q {
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.15);
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: 0.15s;
        }

        .quick-q:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border-color: #6366f1;
        }

        .result-box {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 16px;
            padding: 18px;
            margin-top: 20px;
            display: none;
            animation: msgIn 0.3s ease;
        }

        .result-box.show {
            display: block;
        }

        .result-box h3 {
            font-size: 1rem;
            color: #86efac;
            margin-bottom: 10px;
        }

        .result-box p {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .stats-row {
            display: flex;
            gap: 20px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 12px 18px;
            min-width: 100px;
        }

        .stat-label {
            font-size: 0.72rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #a5b4fc;
        }

        .stat-value.green { color: #86efac; }
        .stat-value.red { color: #fca5a5; }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="logo">
                <div class="logo-icon">🎓</div>
                <div>ИИ-репетитор <span>ОГЭ</span></div>
            </div>
            <div class="subjects" id="subjects">
                <button class="subject-btn active" data-subject="math">📐 Математика</button>
                <button class="subject-btn" data-subject="rus">📖 Русский язык</button>
                <button class="subject-btn" data-subject="inf">💻 Информатика</button>
                <button class="subject-btn" data-subject="soc">🌍 Обществознание</button>
            </div>
        </header>

        <div class="main-grid">
            <div class="card">
                <div class="card-title">
                    📝 Тренажёр заданий
                    <span class="badge">случайные вопросы</span>
                </div>

                <div id="taskArea"></div>

                <div class="result-box" id="resultBox">
                    <h3>🎉 Задание выполнено!</h3>
                    <p id="resultText">Верно! Отличная работа.</p>
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-label">Правильно</div>
                            <div class="stat-value green" id="statCorrect">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Ошибок</div>
                            <div class="stat-value red" id="statWrong">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Всего</div>
                            <div class="stat-value" id="statTotal">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card chat-card">
                <div class="card-title">
                    🤖 ИИ-помощник
                    <span class="badge">онлайн</span>
                </div>

                <div class="chat-messages" id="chatMessages"></div>

                <div class="quick-questions" id="quickQuestions">
                    <div class="quick-q" data-q="объясни тему проценты">💡 Проценты</div>
                    <div class="quick-q" data-q="как решать квадратные уравнения">📐 Уравнения</div>
                    <div class="quick-q" data-q="правила орфографии">✍️ Орфография</div>
                    <div class="quick-q" data-q="что такое алгоритм">💻 Алгоритмы</div>
                </div>

                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="Спроси ИИ о чём угодно...">
                    <button id="chatSend">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ РАСШИРЕННАЯ БАЗА ЗАДАНИЙ ============
        const TASKS = {
            math: [
                {
                    q: "Найдите значение выражения: 3,5 × 2,4 − 1,2 × 5",
                    options: ["2,4", "2,8", "3,2", "1,8"],
                    correct: 0,
                    explanation: "3,5 × 2,4 = 8,4; 1,2 × 5 = 6; 8,4 − 6 = 2,4."
                },
                {
                    q: "Решите уравнение: 2x² − 5x + 3 = 0. Чему равен больший корень?",
                    options: ["1", "1,5", "2", "3"],
                    correct: 1,
                    explanation: "D = 25 − 24 = 1. x₁ = 1,5; x₂ = 1. Больший корень: 1,5."
                },
                {
                    q: "В треугольнике ABC угол C = 90°, AC = 6, BC = 8. Найдите гипотенузу AB.",
                    options: ["10", "12", "14", "9"],
                    correct: 0,
                    explanation: "AB² = 6² + 8² = 36 + 64 = 100. AB = 10."
                },
                {
                    q: "Товар стоил 800 рублей. Цену повысили на 20%. Сколько стал стоить товар?",
                    options: ["820", "960", "880", "1000"],
                    correct: 1,
                    explanation: "20% от 800 = 160. Новая цена: 800 + 160 = 960."
                },
                {
                    q: "Найдите значение: (a + b)² при a = 3, b = −5",
                    options: ["4", "−4", "64", "−64"],
                    correct: 0,
                    explanation: "(3 + (−5))² = (−2)² = 4."
                },
                {
                    q: "Сколько градусов составляет угол, смежный с углом 65°?",
                    options: ["25°", "115°", "65°", "125°"],
                    correct: 1,
                    explanation: "Сумма смежных углов 180°. 180 − 65 = 115°."
                },
                {
                    q: "Найдите 15% от числа 240.",
                    options: ["24", "36", "48", "30"],
                    correct: 1,
                    explanation: "240 ÷ 100 × 15 = 2,4 × 15 = 36."
                },
                {
                    q: "Упростите: 5√2 − √8",
                    options: ["3√2", "√2", "4√2", "2√2"],
                    correct: 0,
                    explanation: "√8 = 2√2. Значит 5√2 − 2√2 = 3√2."
                },
                {
                    q: "Какое из чисел является решением неравенства 3x − 5 > 7?",
                    options: ["3", "4", "5", "2"],
                    correct: 2,
                    explanation: "3x > 12 → x > 4. Из вариантов подходит 5."
                },
                {
                    q: "Чему равна сумма углов выпуклого пятиугольника?",
                    options: ["360°", "540°", "720°", "900°"],
                    correct: 1,
                    explanation: "Сумма углов n-угольника: 180°(n−2). Для n=5: 180 × 3 = 540°."
                },
                {
                    q: "Найдите значение: 0,3 × 0,4 + 0,5",
                    options: ["0,62", "0,17", "0,62", "0,17"],
                    correct: 0,
                    explanation: "0,3 × 0,4 = 0,12; 0,12 + 0,5 = 0,62."
                },
                {
                    q: "Решите уравнение: x/3 = 12",
                    options: ["4", "36", "9", "15"],
                    correct: 1,
                    explanation: "x = 12 × 3 = 36."
                },
                {
                    q: "Площадь прямоугольника со сторонами 8 и 5 равна:",
                    options: ["13", "26", "40", "45"],
                    correct: 2,
                    explanation: "Площадь = 8 × 5 = 40."
                },
                {
                    q: "Найдите 1/4 от 200.",
                    options: ["25", "40", "50", "80"],
                    correct: 2,
                    explanation: "200 ÷ 4 = 50."
                },
                {
                    q: "Чему равен √144?",
                    options: ["11", "12", "13", "14"],
                    correct: 1,
                    explanation: "12 × 12 = 144, значит √144 = 12."
                }
            ],
            rus: [
                {
                    q: "В каком слове пишется НН?",
                    options: ["кожа_ый", "ветре_ый", "стекля_ый", "серебря_ый"],
                    correct: 2,
                    explanation: "«Стеклянный» — исключение с двумя Н."
                },
                {
                    q: "Укажите слово с чередующейся гласной в корне:",
                    options: ["собирать", "сорока", "дорога", "молоко"],
                    correct: 0,
                    explanation: "Корень -бир-/-бер- чередующийся: собИрать (есть -а-)."
                },
                {
                    q: "В каком предложении нужно поставить одну запятую?",
                    options: [
                        "Солнце светит и птицы поют.",
                        "Он пришёл устал и голоден.",
                        "Мама готовила ужин а папа читал газету.",
                        "И день и ночь шёл дождь."
                    ],
                    correct: 2,
                    explanation: "В сложносочинённом предложении перед «а» ставится запятая."
                },
                {
                    q: "Какое средство выразительности: «золотые руки»?",
                    options: ["Эпитет", "Метафора", "Гипербола", "Олицетворение"],
                    correct: 1,
                    explanation: "«Золотые руки» — метафора."
                },
                {
                    q: "В каком слове приставка ПРЕ- пишется в значении «очень»?",
                    options: ["пр_ехать", "пр_красный", "пр_школьный", "пр_открыть"],
                    correct: 1,
                    explanation: "«Прекрасный» = очень красивый. ПРЕ- в значении «очень»."
                },
                {
                    q: "Укажите слово с Ъ (твёрдым знаком):",
                    options: ["с_ел", "в_юга", "под_езд", "сем_я"],
                    correct: 2,
                    explanation: "«Подъезд» — Ъ после приставки на согласную перед Е, Ё, Ю, Я."
                },
                {
                    q: "Какое слово пишется слитно с НЕ?",
                    options: ["(не)красивый, а умный", "(не)правда, а ложь", "(не)ряшливый", "(не)был"],
                    correct: 2,
                    explanation: "«Неряшливый» без НЕ не употребляется — пишется слитно."
                },
                {
                    q: "В каком ряду все слова — синонимы?",
                    options: [
                        "смелый, храбрый, отважный",
                        "дом, здание, жилище",
                        "бежать, идти, ползти",
                        "красный, синий, зелёный"
                    ],
                    correct: 0,
                    explanation: "Смелый, храбрый, отважный — полные синонимы."
                },
                {
                    q: "Найдите слово с ошибкой:",
                    options: ["агентство", "будущий", "следущий", "инцидент"],
                    correct: 2,
                    explanation: "Правильно: «следующий», а не «следущий»."
                },
                {
                    q: "В каком слове ударение на первом слоге?",
                    options: ["звонит", "торты", "банты", "договор"],
                    correct: 1,
                    explanation: "«Тóрты» — ударение на первый слог. Остальные: звонИт, бáнты (тоже 1 слог), договОр."
                },
                {
                    q: "Какое предложение — сложноподчинённое?",
                    options: [
                        "Светило солнце, и пели птицы.",
                        "Когда стемнело, мы пошли домой.",

                {

                    ],
                    correct: 1,
                    explanation: "Мораль — нормы поведения, основанные на добре и зле, поддерживаются обществом."
                },
                {

                    options: ["Административная", "Уголовная", "Дисциплинарная", "Гражданская"],
                    correct: 1,
                    explanation: "Кража — преступление, уголовная ответственность."
                },
                {

                    options: [

                    correct: 0,
                    explanation: "Инфляция — обесценивание денег, рост цен."
                },
                {
                    q: "Какая сфера включает производство товаров?",
                    options: ["Духовная", "Политическая", "Экономическая", "Социальная"],
                    correct: 2,
                    explanation: "Экономическая сфера: производство, обмен, распределение, потребление."
                }
            ]
        };

        // ============ СОСТОЯНИЕ ============
        let currentSubject = 'math';
        let answered = false;
        let stats = { correct: 0, wrong: 0, total: 0 };

        // Механизм "без повторов": очередь перемешанных индексов
        let queue = {};        // очередь для каждого предмета
        let currentTask = null; // текущий вопрос

        // ============ УТИЛИТЫ ============
        // Перемешивание массива (алгоритм Фишера–Йетса)
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // Получить следующий вопрос без повторов
        function getNextTask(subject) {
            const tasks = TASKS[subject];

            // Если очередь пуста или её нет — создаём новую перемешанную
            if (!queue[subject] || queue[subject].length === 0) {
                queue[subject] = shuffle(tasks.map((_, i) => i));
            }

            // Берём первый индекс из очереди
            const idx = queue[subject].shift();

            // Клонируем задание и перемешиваем варианты ответов
            const original = tasks[idx];
            const correctText = original.options[original.correct];

            // Перемешиваем варианты
            const shuffledOptions = shuffle(original.options);
            const newCorrectIndex = shuffledOptions.indexOf(correctText);

            return {
                q: original.q,
                options: shuffledOptions,
                correct: newCorrectIndex,
                explanation: original.explanation
            };
        }

        // ============ DOM ============
        const taskArea = document.getElementById('taskArea');
        const resultBox = document.getElementById('resultBox');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSend = document.getElementById('chatSend');
        const subjectsEl = document.getElementById('subjects');

        // ============ РЕНДЕР ЗАДАНИЯ ============
        function renderTask() {
            // Получаем новый случайный вопрос
            currentTask = getNextTask(currentSubject);
            answered = false;

            // Прогресс: сколько уникальных вопросов уже было в этой сессии
            const totalTasks = TASKS[currentSubject].length;
            const done = totalTasks - queue[currentSubject].length;
            const progress = Math.min((done / totalTasks) * 100, 100);

            taskArea.innerHTML = `
                <div class="task-header">
                    <div class="task-num">Вопрос <strong>${done + 1}</strong> из ${totalTasks} (без повторов)</div>
                    <div class="progress-info">✅ ${stats.correct} · ❌ ${stats.wrong}</div>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${progress}%"></div>
                </div>
                <div class="question">${currentTask.q}</div>
                <div class="options" id="options">
                    ${currentTask.options.map((opt, i) => `
                        <div class="option" data-index="${i}">
                            <div class="letter">${String.fromCharCode(65 + i)}</div>
                            <div>${opt}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="task-actions">
                    <button class="btn btn-secondary" id="nextBtn" disabled>Следующее задание →</button>
                    <button class="btn btn-secondary" id="resetBtn">🔄 Сбросить прогресс</button>
                </div>
            `;

            document.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => selectOption(opt));
            });

            document.getElementById('nextBtn').addEventListener('click', nextTask);
            document.getElementById('resetBtn').addEventListener('click', resetProgress);
        }

        // ============ ВЫБОР ОТВЕТА ============
        function selectOption(optEl) {
            if (answered) return;
            answered = true;

            const selectedIndex = parseInt(optEl.dataset.index);
            const task = currentTask;
            const isCorrect = selectedIndex === task.correct;

            document.querySelectorAll('.option').forEach(o => {
                o.classList.add('disabled');
                const idx = parseInt(o.dataset.index);
                if (idx === task.correct) o.classList.add('correct');
                else if (idx === selectedIndex && !isCorrect) o.classList.add('wrong');
            });

            stats.total++;
            if (isCorrect) {
                stats.correct++;
                showResult(true, task.explanation);
                addChatMessage('ai', `✅ <strong>Верно!</strong> ${task.explanation}`);
            } else {
                stats.wrong++;
                const correctLetter = String.fromCharCode(65 + task.correct);
                showResult(false, `Правильный ответ: ${correctLetter}. ${task.explanation}`);
                addChatMessage('ai', `❌ <strong>Не совсем.</strong> Правильный ответ — ${correctLetter}. ${task.explanation}`);
            }

            document.getElementById('nextBtn').disabled = false;
        }

        function showResult(isCorrect, text) {
            resultBox.classList.add('show');
            document.getElementById('resultText').innerHTML = text;
            document.getElementById('statCorrect').textContent = stats.correct;
            document.getElementById('statWrong').textContent = stats.wrong;
            document.getElementById('statTotal').textContent = stats.total;
        }

        // ============ СЛЕДУЮЩЕЕ ЗАДАНИЕ ============
        function nextTask() {
            resultBox.classList.remove('show');
            renderTask();
        }

        // ============ СБРОС ============
        function resetProgress() {
            stats = { correct: 0, wrong: 0, total: 0 };
            queue[currentSubject] = shuffle(TASKS[currentSubject].map((_, i) => i));
            resultBox.classList.remove('show');
            renderTask();
        }

        // ============ СМЕНА ПРЕДМЕТА ============
        subjectsEl.addEventListener('click', (e) => {
            const btn = e.target.closest('.subject-btn');
            if (!btn) return;

            document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            currentSubject = btn.dataset.subject;
            // Создаём новую перемешанную очередь для этого предмета
            queue[currentSubject] = shuffle(TASKS[currentSubject].map((_, i) => i));
            resultBox.classList.remove('show');
            renderTask();
        });

        // ============ ЧАТ С ИИ ============
        function addChatMessage(role, text) {
            const msg = document.createElement('div');
            msg.className = `msg ${role}`;
            msg.innerHTML = `
                <div class="msg-avatar">${role === 'ai' ? '🤖' : '👤'}</div>
                <div class="msg-bubble">${text}</div>
            `;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function generateAIAnswer(query) {
            const q = query.toLowerCase().trim();

            if (q.includes('привет') || q.includes('здравств') || q.includes('добрый')) {
                return 'Привет! 👋 Спроси меня о любой теме ОГЭ — «проценты», «уравнения», «орфография», «алгоритмы» и т.д.';
            }

            if (q.includes('процент')) {
                return `<strong>Проценты</strong> — сотая часть числа.<br>• 1% = число ÷ 100.<br>• 20% от 800 = 800 ÷ 100 × 20 = 160.<br>• Число по проценту: если 15% = 45, то 100% = 300.`;
            }
            if (q.includes('уравнен') || q.includes('квадрат')) {
                return `<strong>Квадратные уравнения:</strong> ax² + bx + c = 0.<br>D = b² − 4ac.<br>• D > 0 — два корня: x = (−b ± √D) / 2a<br>• D = 0 — один корень: x = −b / 2a<br>• D < 0 — корней нет.`;
            }
            if (q.includes('пифагор') || q.includes('гипотенуз')) {
                return `<strong>Теорема Пифагора:</strong> c² = a² + b².<br>Пример: катеты 6 и 8 → c = √(36+64) = 10.`;
            }
            if (q.includes('орфограф') || q.includes('правописан')) {
                return `<strong>Орфография ОГЭ:</strong><br>• -бир-/-бер-: есть -а- → И, нет → Е.<br>• Н/НН: -ан-, -ян-, -ин- — одна Н; -онн-, -енн- — две Н. Исключения: стеклянный, оловянный, деревянный.`;
            }
            if (q.includes('запят') || q.includes('пунктуац')) {
                return `<strong>Запятые:</strong><br>• Однородные без союзов и с а, но.<br>• Сложносочинённые перед и, а, но.<br>• Сложноподчинённые перед что, чтобы, когда.<br>• Причастные и деепричастные обороты.`;
            }
            if (q.includes('алгоритм')) {
                return `<strong>Алгоритм</strong> — точная последовательность команд.<br>Свойства: дискретность, понятность, конечность, массовость.`;
            }
            if (q.includes('система счислен') || q.includes('двоичн') || q.includes('бит') || q.includes('байт')) {
                return `<strong>Системы счисления:</strong><br>• 1 байт = 8 бит, 1 Кбайт = 1024 байт.<br>• 1011₂ = 8+0+2+1 = 11.<br>• Из 10 в 2: делим на 2, остатки в обратном порядке.`;
            }
            if (q.includes('python') || q.includes('питон')) {
                return `<strong>Python:</strong><br>• Ввод: a = int(input())<br>• Вывод: print(a)<br>• Условие: if a > 0: ... else: ...<br>• Цикл: for i in range(n): ...`;
            }
            if (q.includes('сфер') || q.includes('общество')) {
                return `<strong>Сферы общества:</strong><br>• Экономическая — производство, деньги.<br>• Политическая — власть, партии.<br>• Социальная — семья, классы.<br>• Духовная — наука, искусство, религия.`;
            }
            if (q.includes('демократ') || q.includes('режим')) {
                return `<strong>Демократия:</strong> свободные выборы, многопартийность, права и свободы, независимые СМИ.`;
            }
            if (q.includes('правонарушен') || q.includes('ответственност') || q.includes('налог')) {
                return `<strong>Правонарушения и налоги:</strong><br>• Преступление — уголовная ответственность.<br>• Проступок — административная.<br>• Прямые налоги: НДФЛ, на имущество.<br>• Косвенные: НДС, акциз.`;
            }
            if (q.includes('как готов') || q.includes('совет') || q.includes('подготов')) {
                return `<strong>Советы:</strong><br>1. План: 1–2 темы в день.<br>2. Пробник раз в неделю.<br>3. Тетрадь ошибок.<br>4. Повторение за месяц до экзамена.`;
            }
            if (q.includes('балл')) {
                return `Максимум: математика — 31, русский — 33, информатика — 19, обществознание — 37. Шкала обновляется на сайте ФИПИ.`;
            }

            if (q.length < 3) {
                return 'Напиши вопрос подробнее — например, «объясни проценты».';
            }

            return `Не знаю точного ответа, но помогу с темами:<br>• Математика: проценты, уравнения, Пифагор<br>• Русский: орфография, пунктуация<br>• Информатика: алгоритмы, системы счисления, Python<br>• Обществознание: сферы, режимы, налоги`;
        }

        function sendChat() {
            const text = chatInput.value.trim();
            if (!text) return;
            addChatMessage('user', text);
            chatInput.value = '';
            setTimeout(() => {
                addChatMessage('ai', generateAIAnswer(text));
            }, 400);
        }

        chatSend.addEventListener('click', sendChat);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        document.getElementById('quickQuestions').addEventListener('click', (e) => {
            const q = e.target.closest('.quick-q');
            if (!q) return;
            chatInput.value = q.dataset.q;
            sendChat();
        });

        // ============ ИНИЦИАЛИЗАЦИЯ ============
        // Создаём перемешанную очередь для стартового предмета
        queue[currentSubject] = shuffle(TASKS[currentSubject].map((_, i) => i));
        renderTask();
        addChatMessage('ai', 'Привет! 👋 Вопросы теперь всегда разные и не повторяются, пока не пройдёшь все. Выбирай предмет и решай! 🎓');
